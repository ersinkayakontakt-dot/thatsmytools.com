<!doctype html>
<!--
  Vorlage für die Social-Media-Vorschaubilder (1200 × 630).
  Wird von scripts/make-images.mjs mit Chromium gerendert.

  Die drei Platzhalter in doppelten geschweiften Klammern (Überschrift,
  Untertext, Fußzeile) werden ersetzt. Die Texte kommen aus
  der SEO-Seitenkarte (src/data/seo-pages.ts) – also aus derselben Quelle
  wie H1 und Meta Description der Seite. So kann das Vorschaubild nicht
  etwas anderes behaupten als die Seite selbst.

  Neu erzeugen mit:  npm run images:og

  Bewusst ohne auto-Margins und ohne height:100% aufgebaut: feste Abstände
  rendern in Headless-Chromium zuverlässig reproduzierbar.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #ffffff;
        color: #14171a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        position: relative;
        overflow: hidden;
      }
      /* Signalkante oben, wie eine Markierung auf dem Boden */
      .bar { height: 14px; background: #d2400f; }
      .inner { padding: 54px 80px; }

      .brandrow { display: flex; align-items: center; gap: 16px; }
      .mark { width: 46px; height: 46px; }
      .brand { font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
      .brand em { font-style: normal; background: #d2400f; color: #fff; padding: 0 7px; margin-left: 3px; }

      h1 { font-size: 62px; font-weight: 800; line-height: 1.06; letter-spacing: -.035em;
           margin-top: 44px; max-width: 17ch; }
      p { font-size: 25px; color: #31383d; max-width: 44ch; line-height: 1.4; margin-top: 22px; }

      .foot { margin-top: 40px; display: flex; justify-content: space-between; align-items: baseline;
              padding-top: 22px; border-top: 3px solid #14171a;
              font-size: 22px; font-weight: 600; color: #525a60; }
      .foot strong { color: #14171a; font-weight: 800; letter-spacing: -.02em; }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="inner">
      <div class="brandrow">
        <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="#14171a" stroke-width="2.6"
             stroke-linejoin="miter" stroke-linecap="butt">
          <path d="M4 13.5 16 5l12 8.5" />
          <path d="M6.5 15v8.5h19V15" />
        </svg>
        <div class="brand">Schnellhelfer<em>24</em></div>
      </div>

      <h1>{{HEADLINE}}</h1>
      <p>{{TEXT}}</p>

      <div class="foot">
        <div>{{FOOT}}</div>
        <div><strong>schnellhelfer24.de</strong></div>
      </div>
    </div>
  </body>
</html>
