<!doctype html>
<!-- Vorlage für apple-touch-icon.png (180 × 180). Siehe scripts/make-images.mjs -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      body { width: 180px; height: 180px; background: #14171a; position: relative; }
      .wrap { height: 180px; display: grid; place-items: center; }
      svg { width: 108px; height: 108px; }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: #d24507; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 32 32" fill="none" stroke="#ffffff" stroke-width="2.8"
           stroke-linejoin="miter" stroke-linecap="butt">
        <path d="M4 13.5 16 5l12 8.5" />
        <path d="M6.5 15v8.5h19V15" />
      </svg>
    </div>
    <div class="bar"></div>
  </body>
</html>
